[package]
name = "libinfer-gemini"
version = "0.1.1"
edition = "2024"
description = "The Gemini provider for libinfer: GeminiReasoningEngine on gemini-rust."

[dependencies]
libinfer = { path = "../libinfer" }
# Used directly, not through libgenai
# (docs/design/20261022_07_LIBINFER_PROVIDERS_PLAN.md, section 2).
gemini-rust = "1.7"
async-compat = "0.2"
async-trait = "0.1"
log = "0.4"
# The model list (docs/design/20261030_01_GEMINI_MODEL_CHOICE_PLAN.md,
# section 4): reqwest 0.12 with gemini-rust 1.7.1's TLS (rustls), so no
# second TLS stack.
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
